name: Deploy Frontend → Vercel

# Se dispara automáticamente con push a main si cambia algo del frontend
# o del workflow mismo. Se puede correr manualmente desde Actions UI.
on:
  push:
    branches: [main]
    paths:
      - 'plataforma-ia-front/**'
      - '.github/workflows/deploy-frontend.yml'
  workflow_dispatch:

env:
  VERCEL_ORG_ID:     ${{ vars.VERCEL_ORG_ID }}
  VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}

concurrency:
  group: deploy-frontend
  cancel-in-progress: true

jobs:
  deploy:
    name: Build + Deploy a Vercel
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: plataforma-ia-front
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: 'plataforma-ia-front/package-lock.json'

      - name: Instalar Vercel CLI
        run: npm install -g vercel@latest

      - name: Vercel pull (descarga config del proyecto linkeado)
        run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}

      - name: Build
        run: vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}

      - name: Deploy a Vercel (prebuilt)
        id: deploy
        run: |
          URL=$(vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }})
          echo "url=$URL" >> "$GITHUB_OUTPUT"
          echo "✓ Deploy: $URL"

      - name: Summary
        run: |
          echo "### 🚀 Frontend deployed" >> $GITHUB_STEP_SUMMARY
          echo "**URL:** ${{ steps.deploy.outputs.url }}" >> $GITHUB_STEP_SUMMARY
